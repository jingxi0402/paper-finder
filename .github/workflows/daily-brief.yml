name: Daily Journal Brief

on:
  schedule:
    # 05:15 UTC = 07:15 Zurich (CEST) / 06:15 (CET). Weekdays only.
    - cron: "15 5 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: journal-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect and score
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '2' }}
        run: python src/main.py

      - name: Publish
        run: |
          git config user.name  "journal-brief-bot"
          git config user.email "actions@github.com"
          git add docs/data/items.json docs/feed.xml state/seen.json
          git diff --staged --quiet || git commit -m "brief: $(date -u +%F)"
          git push
