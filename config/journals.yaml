# Journal whitelist = your IF / 中科院分区 lookup table.
#
# IMPORTANT: IF and 分区 are proprietary data with no free API. The values below
# are approximate (JCR 2024 IF, 中科院 2025 大类分区) and MUST be verified against
# the official release before you trust them. Update once a year.
#
# fields:
#   issn      : any ISSN that PubMed/Crossref indexes (print or electronic)
#   pubmed    : exact PubMed journal title abbreviation used in [Journal] queries
#   if        : journal impact factor
#   tier      : 中科院分区 大类  -> one of: 1区Top / 1区 / 2区 / 3区 / 4区
#   category  : 大类学科 (display only)

journals:
  # ---------- 综合性期刊 ----------
  - name: Nature
    issn: "0028-0836"
    pubmed: "Nature"
    if: 50.5
    tier: "1区Top"
    category: "综合性期刊"

  - name: Science
    issn: "0036-8075"
    pubmed: "Science"
    if: 44.7
    tier: "1区Top"
    category: "综合性期刊"

  - name: Nature Communications
    issn: "2041-1723"
    pubmed: "Nat Commun"
    if: 14.7
    tier: "1区"
    category: "综合性期刊"

  - name: Science Advances
    issn: "2375-2548"
    pubmed: "Sci Adv"
    if: 11.7
    tier: "1区"
    category: "综合性期刊"

  # ---------- 微生物 / 肠道 ----------
