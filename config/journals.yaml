    issn: "1552-4450"
    pubmed: "Nat Chem Biol"
    if: 12.9
    tier: "1区Top"
    category: "化学"

  - name: Journal of the American Chemical Society
    issn: "0002-7863"
    pubmed: "J Am Chem Soc"
    if: 14.4
    tier: "1区Top"
    category: "化学"

  - name: Analytical Chemistry
    issn: "0003-2700"
