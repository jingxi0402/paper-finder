    issn: "0092-8674"
    pubmed: "Cell"
    if: 45.5
    tier: "1区Top"
    category: "生物学"

  - name: Nature Microbiology
    issn: "2058-5276"
    pubmed: "Nat Microbiol"
    if: 20.5
    tier: "1区Top"
    category: "生物学"

  - name: Cell Host & Microbe
    issn: "1931-3128"
    pubmed: "Cell Host Microbe"
    if: 20.6
    tier: "1区Top"
    category: "生物学"

  - name: The ISME Journal
    issn: "1751-7362"
    pubmed: "ISME J"
    if: 10.8
    tier: "1区Top"
    category: "生物学"

  - name: Microbiome
    issn: "2049-2618"
    pubmed: "Microbiome"
    if: 13.8
    tier: "1区Top"
    category: "生物学"

  - name: Gut Microbes
    issn: "1949-0976"
    pubmed: "Gut Microbes"
    if: 12.2
    tier: "1区"
    category: "生物学"

  - name: Gut
    issn: "0017-5749"
    pubmed: "Gut"
    if: 23.0
    tier: "1区Top"
    category: "医学"

  - name: Cell Metabolism
    issn: "1550-4131"
    pubmed: "Cell Metab"
