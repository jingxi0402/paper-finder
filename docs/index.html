<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Journal Brief</title>
<link rel="alternate" type="application/rss+xml" title="Journal Brief" href="feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="masthead-row">
      <h1>Journal&nbsp;Brief</h1>
      <div class="readout" id="readout">
        <span class="readout-cell"><b id="stat-new">—</b> new</span>
        <span class="readout-cell"><b id="stat-total">—</b> archived</span>
        <span class="readout-cell" id="stat-gen">—</span>
      </div>
    </div>

    <!-- Signal trace: one column per day, stacked by score, coloured by topic -->
    <figure class="trace" id="trace">
      <figcaption class="trace-caption">
        <span>Signal, last 45 days</span>
        <span class="trace-hint" id="trace-hint">column height = total score</span>
      </figcaption>
      <svg id="trace-svg" viewBox="0 0 900 96" preserveAspectRatio="none"
           role="img" aria-label="Daily paper volume for the last 45 days"></svg>
      <div class="trace-axis"><span id="trace-from">—</span><span id="trace-to">—</span></div>
    </figure>
  </div>
</header>

<nav class="controls" id="controls">
  <div class="wrap controls-inner">
    <label class="field search">
      <span class="sr-only">Search titles, abstracts, authors and journals</span>
      <input id="q" type="search" placeholder="Search titles, abstracts, authors…"
             autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>

    <label class="field">
      <span class="field-label">Tier</span>
      <select id="tier">
        <option value="">all</option>
        <option value="1区Top">1区Top</option>
        <option value="1区">1区 and up</option>
        <option value="2区">2区 and up</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">Type</span>
      <select id="kind">
        <option value="">all</option>
        <option value="journal">peer-reviewed</option>
        <option value="preprint">preprints</option>
      </select>
    </label>

    <label class="field range">
      <span class="field-label">Min score <b id="minscore-val">0</b></span>
      <input id="minscore" type="range" min="0" max="40" step="1" value="0">
    </label>

    <button id="reset" class="reset" type="button">Reset</button>
  </div>
  <div class="wrap topics" id="topics"></div>
</nav>

<main class="wrap" id="results" aria-live="polite">
  <p class="empty">Loading…</p>
</main>

<footer class="wrap foot">
  <p>
    Sources: PubMed, bioRxiv, chemRxiv · rebuilt every weekday morning ·
    <a href="feed.xml">RSS</a>
  </p>
  <p class="foot-dim">
    Keywords and thresholds live in <code>config/topics.yaml</code>.
    IF and 中科院分区 live in <code>config/journals.yaml</code> and need
    verifying once a year.
  </p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
